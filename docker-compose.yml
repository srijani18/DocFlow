# Local Postgres + pgvector. Same image as CI; major version matches Neon (overview A7).
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow  # local only; never used outside this container
      POSTGRES_DB: docflow
    ports:
      - "${DOCFLOW_PG_PORT:-54320}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow -d docflow"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
