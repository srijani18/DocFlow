# Render Blueprint: the production API (infrastructure as code).
# First-time setup and every secret value: see docs/deploy.md.
services:
  - type: web
    name: docflow-api
    runtime: docker
    plan: free
    region: singapore  # next to Supabase ap-southeast-1 (overview A5)
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz  # liveness only: a database blip must not restart the service
    autoDeployTrigger: checksPass  # waits for the `ci-ok` check
    buildFilter:
      paths:
        - apps/api/**
        - schemas/**
    envVars:
      - key: ROLE
        value: all
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      # Secrets and per-deployment values: entered in the dashboard, never committed.
      - key: DATABASE_URL  # Supabase session pooler (ADR-0007)
        sync: false
      - key: SUPABASE_URL  # https://<ref>.supabase.co
        sync: false
      - key: SUPABASE_SECRET_KEY  # sb_secret_… (Storage)
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_REGEX
        sync: false
